<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>장면 예시: 전화 메뉴 숫자판</title>
<link rel="icon" href="data:,">
<!--
'제품에서만 나오는 장면'의 예. 전화 상담을 대신하는 서비스라면, 기존 방식의 그림은 전화기 숫자판이다.
메뉴가 붙은 숫자가 1번부터 차례로 켜져서 '메뉴를 끝까지 들어야 한다'는 불편을 그대로 보여 준다.
본(template/index.html)의 '그림 하나와 큰 문장들' 구획에서 그림 자리에 넣어 쓴다.
본에 넣을 때는 구획에 data-scene을 달고, 아래 선택자의 `.phone:not(.in)`과 `.phone.in`을
`[data-scene]:not(.in) .phone`과 `[data-scene].in .phone`으로 바꾼다. 맨 아래 스크립트는 지운다.
아래 메뉴 이름은 예시로 지어낸 것이다. 실제 메뉴로 바꾼다.
-->
<script>document.documentElement.classList.add('js')</script>
<style>
@font-face{font-family:Pretendard;font-weight:600;font-display:swap;src:url('../template/assets/fonts/Pretendard-SemiBold.woff2') format('woff2')}
:root{--ink:#102a43;--sub:#4a5c74;--paper:#fff;--r-s:4px}
*,*::before,*::after{box-sizing:border-box}
body{display:grid;place-items:center;min-height:100dvh;margin:0;padding:24px;background:var(--paper);color:var(--ink);font:600 1rem/1.6 Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
ul{margin:0;padding:0;list-style:none}
p{margin:0}
button{cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* 전화기: 크기는 글자 크기 하나로 정한다(전부 em) */
.phone{display:grid;width:min(100%,21em);margin:0;padding:1.5em 1.5em 1.9em;border-radius:2.4em;background:var(--ink);color:#fff;font-size:clamp(14px,2.15vh,21px)}
.phone-top{text-align:center;color:#c3cedb}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1em .6em;margin-top:1.3em}
.pad li{display:grid;justify-items:center;align-content:start;gap:.4em;min-height:6.1em}
.pad b{display:grid;place-items:center;width:3.5em;aspect-ratio:1;border:1px solid rgba(255,255,255,.3);border-radius:50%;color:#aeb9c7;font-size:1.25em;font-variant-numeric:tabular-nums}
.pad span{font-size:.8em;line-height:1.3;text-align:center}
.pad .on b{border-color:#fff;background:#fff;color:var(--ink)}
.replay{display:none;justify-self:center;align-items:center;min-height:44px;margin-top:.4em;padding:0 6px;border:0;border-radius:var(--r-s);background:none;color:#c3cedb;font:inherit;font-size:.9375rem;text-decoration:underline;text-underline-offset:5px}
.replay:hover,.replay:active{color:#fff;text-decoration-thickness:2px}
.phone :focus-visible{outline:3px solid #fff;outline-offset:3px}

/* 메뉴가 붙은 숫자가 차례로 켜진다. --i가 순서 */
@keyframes lit{from{border-color:rgba(255,255,255,.3);background:transparent;color:#aeb9c7}}
@keyframes show{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:no-preference){
  .js .phone:not(.in) .on b{border-color:rgba(255,255,255,.3);background:transparent;color:#aeb9c7}
  .js .phone:not(.in) .on span{opacity:0}
  .js .phone.in .on b{animation:lit .45s both;animation-delay:calc(var(--i) * .55s + .3s)}
  .js .phone.in .on span{animation:show .45s both;animation-delay:calc(var(--i) * .55s + .3s)}
  .js .replay{display:inline-flex}
}
</style>
</head>
<body>
<main>
  <h1 class="sr">장면 예시: 전화 메뉴 숫자판</h1>
  <figure class="phone" aria-labelledby="phone-top">
    <p class="phone-top" id="phone-top">전화 ARS</p>
    <ul class="pad">
      <li class="on" style="--i:0"><b>1<span class="sr">번</span></b><span>주문 조회</span></li>
      <li class="on" style="--i:1"><b>2<span class="sr">번</span></b><span>배송 변경</span></li>
      <li class="on" style="--i:2"><b>3<span class="sr">번</span></b><span>교환·환불</span></li>
      <li class="on" style="--i:3"><b>4<span class="sr">번</span></b><span>결제</span></li>
      <li class="on" style="--i:4"><b>5<span class="sr">번</span></b><span>영수증</span></li>
      <li aria-hidden="true"><b>6</b></li>
      <li aria-hidden="true"><b>7</b></li>
      <li aria-hidden="true"><b>8</b></li>
      <li aria-hidden="true"><b>9</b></li>
      <li aria-hidden="true"><b>*</b></li>
      <li class="on" style="--i:5"><b>0<span class="sr">번</span></b><span>상담원 연결</span></li>
      <li aria-hidden="true"><b>#</b></li>
    </ul>
    <button class="replay" type="button">다시 보기</button>
  </figure>
</main>
<script>
// 본에서는 구획의 data-scene이 이 일을 한다. 여기서는 혼자 도는 예시라 직접 켠다
const phone = document.querySelector('.phone');
function play() { phone.classList.remove('in'); void phone.offsetWidth; phone.classList.add('in'); }
phone.querySelector('.replay').addEventListener('click', play);
play();
</script>
</body>
</html>
